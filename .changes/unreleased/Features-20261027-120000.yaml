kind: Features
body: Add `full_refresh_strategy: swap` to rebuild table and incremental models into a shadow relation, optionally in hash `chunks`, and swap it in only after the rebuild succeeds. The chunk predicate and swap are overridable through the dispatched `get_chunk_predicate` and `swap_relations` macros.
